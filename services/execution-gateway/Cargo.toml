[package]
name = "execution-gateway"
version = "1.0.0"
edition = "2021"
description = "HFT platform service S4: translates order intents into venue orders, manages order lifecycle (new/modify/cancel), tracks acknowledgments and fills"
license = "MIT"

[[bin]]
name = "execution-gateway"
path = "src/main.rs"

[lib]
name = "exg"
path = "src/lib.rs"

[dependencies]
# Intentionally empty — the platform constraint is std-only (no external crates).

[profile.release]
opt-level = 3
lto = true
