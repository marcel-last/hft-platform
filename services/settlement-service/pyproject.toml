[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "settlement-service"
version = "1.0.0"
description = "HFT platform S14: idempotent settlement, statement reconciliation, netting, and tamper-evident EOD sealing."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
