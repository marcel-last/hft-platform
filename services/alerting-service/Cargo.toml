[package]
name = "alerting-service"
version = "1.0.0"
edition = "2021"
description = "HFT platform service S10: central alert aggregation, dedup/suppression, escalation, acknowledgement tracking and stats for all upstream alert producers (S5 risk-manager, S7 latency-monitor, S8 data-quality-monitor)"
license = "MIT"

[[bin]]
name = "alerting-service"
path = "src/main.rs"

[lib]
name = "altsvc"
path = "src/lib.rs"

[dependencies]
# Intentionally empty — the platform constraint is std-only (no external crates).

[profile.release]
opt-level = 3
lto = true
